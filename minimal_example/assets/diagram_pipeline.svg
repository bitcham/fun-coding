<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <rect width="600" height="440" fill="#1a1b26"/>

  <!-- 1. 6 문장 -->
  <rect x="230" y="20" width="140" height="50" rx="6" fill="#24283b" stroke="#7aa2f7" stroke-width="2"/>
  <text x="300" y="51" text-anchor="middle" fill="#c0caf5" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif" font-size="16" font-weight="600">6 문장</text>

  <line x1="300" y1="70" x2="300" y2="92" stroke="#7aa2f7" stroke-width="2"/>
  <polygon points="300,100 295,90 305,90" fill="#7aa2f7"/>

  <!-- 2. 학습 쌍 -->
  <rect x="160" y="100" width="280" height="70" rx="6" fill="#24283b" stroke="#7aa2f7" stroke-width="2"/>
  <text x="300" y="128" text-anchor="middle" fill="#c0caf5" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif" font-size="16" font-weight="600">학습 쌍 생성</text>
  <text x="300" y="152" text-anchor="middle" fill="#9aa5ce" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif" font-size="13">sliding window → 24 쌍 (X, y)</text>

  <!-- branch -->
  <line x1="300" y1="170" x2="300" y2="195" stroke="#7aa2f7" stroke-width="2"/>
  <line x1="160" y1="195" x2="440" y2="195" stroke="#7aa2f7" stroke-width="2"/>
  <line x1="160" y1="195" x2="160" y2="212" stroke="#7aa2f7" stroke-width="2"/>
  <polygon points="160,220 155,210 165,210" fill="#7aa2f7"/>
  <line x1="440" y1="195" x2="440" y2="212" stroke="#7aa2f7" stroke-width="2"/>
  <polygon points="440,220 435,210 445,210" fill="#7aa2f7"/>

  <!-- 4. n-gram -->
  <rect x="80" y="220" width="160" height="80" rx="6" fill="#1f2937" stroke="#9ece6a" stroke-width="2"/>
  <text x="160" y="250" text-anchor="middle" fill="#c0caf5" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif" font-size="16" font-weight="600">n-gram 학습</text>
  <text x="160" y="280" text-anchor="middle" fill="#9aa5ce" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif" font-size="13">카운트만</text>

  <!-- 5. NLM -->
  <rect x="360" y="220" width="160" height="80" rx="6" fill="#1f2937" stroke="#f7768e" stroke-width="2"/>
  <text x="440" y="250" text-anchor="middle" fill="#c0caf5" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif" font-size="16" font-weight="600">NLM 학습</text>
  <text x="440" y="280" text-anchor="middle" fill="#9aa5ce" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif" font-size="13">forward + backward + SGD</text>

  <!-- merge -->
  <line x1="160" y1="300" x2="160" y2="325" stroke="#7aa2f7" stroke-width="2"/>
  <line x1="440" y1="300" x2="440" y2="325" stroke="#7aa2f7" stroke-width="2"/>
  <line x1="160" y1="325" x2="440" y2="325" stroke="#7aa2f7" stroke-width="2"/>
  <line x1="300" y1="325" x2="300" y2="347" stroke="#7aa2f7" stroke-width="2"/>
  <polygon points="300,355 295,345 305,345" fill="#7aa2f7"/>

  <!-- 6. eval -->
  <rect x="140" y="355" width="320" height="65" rx="6" fill="#24283b" stroke="#e0af68" stroke-width="2"/>
  <text x="300" y="383" text-anchor="middle" fill="#c0caf5" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif" font-size="16" font-weight="600">샘플링 · perplexity · 일반화 검증</text>
  <text x="300" y="405" text-anchor="middle" fill="#9aa5ce" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif" font-size="13">두 모델의 분포·생성을 비교</text>
</svg>
